; ── WeConnect PHP Runtime Configuration ──────────────────────────────────────

; Error reporting — log only, never display in production
display_errors     = Off
log_errors         = On
error_reporting    = E_ALL

; Limits
max_execution_time = 30
memory_limit       = 128M
post_max_size      = 8M
upload_max_filesize = 8M

; Session hardening
session.cookie_httponly = 1
session.cookie_samesite = "Strict"
session.use_strict_mode = 1
session.gc_maxlifetime  = 1800

; Timezone
date.timezone = UTC
