# ─────────────────────────────────────────────────────────────────────────────
# WeConnect — Credentials Secret
#
# IMPORTANT: Never commit real values here.
# Replace the base64 placeholders before applying:
#
#   echo -n 'your-db-password'    | base64   → WECON_DB_PASS
#   echo -n 'your-admin-password' | base64   → WECON_ADMIN_PASS
#
# Or use a secrets manager (Vault, AWS Secrets Manager, Sealed Secrets).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: weconnect-secrets
  namespace: weconnect
  labels:
    app.kubernetes.io/name:      weconnect
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # base64-encoded values — REPLACE before deploying
  WECON_DB_PASS:    Y2hhbmdlbWU=      # "changeme"
  WECON_ADMIN_PASS: YWRtaW5wYXNz      # "adminpass"
  MYSQL_ROOT_PASSWORD: Y2hhbmdlbWU=  # same as WECON_DB_PASS
